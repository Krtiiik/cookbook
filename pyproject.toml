[project]
name = "cookbook"
version = "0.1.0"
description = "Krtkova Kuchařka: a Czech recipe and cooking reference site, built as a static site"
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown>=3.11.3",
    "pillow>=12.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
