    <circle cx="214" cy="356" r="3"/><circle cx="224" cy="352" r="3"/><circle cx="234" cy="357" r="3"/><circle cx="244" cy="353" r="3"/><circle cx="254" cy="357" r="3"/><circle cx="264" cy="352" r="3"/><circle cx="274" cy="356" r="3"/><circle cx="229" cy="346" r="3"/><circle cx="240" cy="343" r="3"/><circle cx="251" cy="347" r="3"/><circle cx="262" cy="344" r="3"/><circle cx="244" cy="336" r="3"/><circle cx="255" cy="337" r="3"/>
  </g>

