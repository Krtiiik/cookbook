  <g transform="translate(1010 262)">
    <path d="M-110 0 L-86 78 Q-80 96 -62 96 L62 96 Q80 96 86 78 L110 0 Z" style="fill: var(--banner-cool, #1f4fa3); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linejoin: round"/>
    <g style="fill: #fff7ea"><circle cx="-56" cy="52" r="8"/><circle cx="0" cy="72" r="8"/><circle cx="56" cy="50" r="8"/></g>
    <ellipse cx="0" cy="0" rx="110" ry="22" style="fill: var(--banner-cool, #1f4fa3); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6"/>
    <ellipse cx="0" cy="3" rx="96" ry="15" style="fill: #fff7ea; stroke: var(--banner-fg, #1b2a4a); stroke-width: 4"/>
