      <circle cx="-4" cy="-44" r="2.5"/><circle cx="-30" cy="-24" r="2.5"/><circle cx="20" cy="-26" r="2.5"/><circle cx="-52" cy="-6" r="2.5"/><circle cx="0" cy="-8" r="2.5"/><circle cx="46" cy="-4" r="2.5"/><circle cx="-24" cy="8" r="2.5"/><circle cx="30" cy="10" r="2.5"/>
