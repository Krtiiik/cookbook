<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Podélně rozříznutý tmavý lusk vanilky s vyškrábanými černými semínky a nožem, vedle dvě misky cukru: vanilkový cukr s černými tečkami semínek a čistě bílý vanilinový cukr">
  <rect width="1200" height="400" style="fill: var(--banner-bg, #fffaf0)"/>
  <path d="M60 366 H1140" style="stroke: var(--banner-fg, #1b2a4a); stroke-width: 4; stroke-dasharray: 2 12; stroke-linecap: round; opacity: .45"/>

  <!-- split pod -->
  <path d="M64 300 C200 322 380 268 536 176 L546 204 C390 300 210 350 64 324 Z" style="fill: var(--banner-warm, #e9b44c); fill: color-mix(in srgb, var(--banner-warm, #e9b44c) 40%, black); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linejoin: round"/>
  <path d="M64 312 C200 336 385 284 541 190" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 22; stroke-linecap: round; stroke-dasharray: 440 2000; stroke-dashoffset: -34"/>
  <path d="M64 312 C200 336 385 284 541 190" style="fill: none; stroke: var(--banner-warm, #e9b44c); stroke-width: 13; stroke-linecap: round; stroke-dasharray: 440 2000; stroke-dashoffset: -34"/>
  <g style="fill: var(--banner-fg, #1b2a4a)">
    <circle cx="140" cy="321" r="2.8"/><circle cx="162" cy="324" r="2.8"/><circle cx="186" cy="316" r="2.8"/><circle cx="208" cy="314" r="2.8"/><circle cx="232" cy="308" r="2.8"/><circle cx="252" cy="304" r="2.8"/><circle cx="272" cy="299" r="2.8"/><circle cx="294" cy="296" r="2.8"/><circle cx="314" cy="291" r="2.8"/><circle cx="336" cy="285" r="2.8"/><circle cx="358" cy="276" r="2.8"/><circle cx="382" cy="268" r="2.8"/><circle cx="404" cy="261" r="2.8"/><circle cx="426" cy="250" r="2.8"/><circle cx="448" cy="240" r="2.8"/><circle cx="470" cy="228" r="2.8"/>
  </g>
  <path d="M96 296 q60 6 130 -8" style="fill: none; stroke: #fff7ea; stroke-width: 3; stroke-linecap: round; opacity: .5"/>

  <!-- seeds scraped out -->
