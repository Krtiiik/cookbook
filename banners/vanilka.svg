  <!-- notes -->
  <text x="60" y="80" style="font: 600 40px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">semínka seškrábni</text>
  <text x="60" y="124" style="font: 600 40px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">hřbetem nože</text>
  <path d="M250 140 q10 56 70 108" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round"/>
  <text x="590" y="76" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">vanilkový:</text>
  <text x="590" y="118" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">pravá vanilka</text>
  <path d="M700 132 q22 24 36 52" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round"/>
  <text x="930" y="96" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">vanilinový:</text>
  <text x="930" y="138" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">jen vanilin</text>
  <path d="M1010 152 q-8 18 -2 36" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round"/>
</svg>
