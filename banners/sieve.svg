  <rect x="535" y="336" width="130" height="16" rx="6" style="fill: var(--banner-accent, #c8462a); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6"/>
  <g class="steam" style="fill: none; stroke: var(--banner-cool, #1f4fa3); stroke-width: 6; stroke-linecap: round">
