    <circle cx="500" cy="291" r="5"/><circle cx="540" cy="291" r="5"/><circle cx="580" cy="291" r="5"/><circle cx="620" cy="291" r="5"/><circle cx="660" cy="291" r="5"/><circle cx="700" cy="291" r="5"/>
    <circle cx="520" cy="320" r="5"/><circle cx="560" cy="320" r="5"/><circle cx="600" cy="320" r="5"/><circle cx="640" cy="320" r="5"/><circle cx="680" cy="320" r="5"/>
