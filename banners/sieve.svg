<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Tři pomůcky na cezení: jemné sítko s dlouhou rukojetí nad hrncem, z něhož kapou kapky vývaru, červený cedník s dírkami a horkými párajícími bramborami a složené plátýnko">
  <style>.steam path{animation:steam-rise 3.4s ease-in-out infinite}.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.2s}@keyframes steam-rise{0%{opacity:0;transform:translateY(12px)}40%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}</style>
  <rect width="1200" height="400" style="fill: var(--banner-bg, #fffaf0)"/>
  <path d="M60 362 H1140" style="stroke: var(--banner-fg, #1b2a4a); stroke-width: 4; stroke-dasharray: 2 12; stroke-linecap: round; opacity: .45"/>

  <!-- pot under the sieve -->
  <path d="M104 262 H356 V330 Q356 348 338 348 H122 Q104 348 104 330 Z" style="fill: var(--banner-cool, #1f4fa3); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linejoin: round"/>
  <g style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linecap: round">
    <path d="M104 286 q-22 0 -22 14 q0 12 22 12"/>
    <path d="M356 286 q22 0 22 14 q0 12 -22 12"/>
  </g>
  <rect x="98" y="252" width="264" height="18" rx="9" style="fill: var(--banner-cool, #1f4fa3); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6"/>
  <g style="fill: #fff7ea"><circle cx="150" cy="306" r="8"/><circle cx="230" cy="316" r="8"/><circle cx="310" cy="306" r="8"/></g>

  <!-- drips -->
  <g style="fill: var(--banner-warm, #e9b44c); stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linejoin: round">
    <path d="M214 222 q-8 11 0 16 q8 -5 0 -16 Z"/>
    <path d="M246 228 q-8 11 0 16 q8 -5 0 -16 Z"/>
  </g>

  <!-- sieve: mesh bowl, rim, hook, handle -->
  <path d="M140 130 A90 85 0 0 0 320 130 Z" style="fill: #fff7ea; stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linejoin: round"/>
  <g style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round; opacity: .45">
    <path d="M150 155 H310"/>
    <path d="M162 180 H298"/>
    <path d="M182 200 H278"/>
    <path d="M170 134 V188"/>
    <path d="M200 134 V204"/>
    <path d="M230 134 V208"/>
    <path d="M260 134 V204"/>
    <path d="M290 134 V188"/>
  </g>
  <rect x="132" y="122" width="196" height="16" rx="8" style="fill: var(--banner-warm, #e9b44c); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6"/>
  <path d="M138 124 q-22 -4 -20 -24" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linecap: round"/>
  <path d="M326 128 L360 118" style="stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linecap: round"/>
  <path d="M358 118 L446 94" style="stroke: var(--banner-fg, #1b2a4a); stroke-width: 26; stroke-linecap: round"/>
  <path d="M358 118 L446 94" style="stroke: var(--banner-accent, #c8462a); stroke-width: 15; stroke-linecap: round"/>

