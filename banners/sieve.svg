    <path d="M904 284 H1106 Q1114 284 1114 292 V308 Q1114 316 1106 316 H904 Q896 316 896 308 V292 Q896 284 904 284 Z"/>
    <path d="M914 252 H1096 Q1104 252 1104 260 V276 Q1104 284 1096 284 H914 Q906 284 906 276 V260 Q906 252 914 252 Z"/>
  </g>
  <g style="fill: none; stroke: var(--banner-accent, #c8462a); stroke-width: 5; stroke-linecap: round">
    <path d="M902 332 H1108"/>
    <path d="M912 300 H1098"/>
    <path d="M922 268 H1088"/>
  </g>
  <g style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 8; opacity: .45">
    <path d="M902 340 H1108"/>
    <path d="M912 308 H1098"/>
    <path d="M922 276 H1088"/>
  </g>

  <!-- notes -->
  <path d="M200 84 q14 16 8 34" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round"/>
  <text x="50" y="70" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">čirý vývar</text>
  <path d="M810 142 q-6 62 -62 108" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round"/>
  <text x="770" y="120" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">nech okapat</text>
  <path d="M1030 212 q8 18 -4 34" style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 3; stroke-linecap: round"/>
  <text x="950" y="196" style="font: 600 38px Caveat, cursive; fill: var(--banner-fg, #1b2a4a)">nejjemnější</text>
</svg>
