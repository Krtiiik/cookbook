    <ellipse cx="605" cy="206" rx="56" ry="36" transform="rotate(4 605 206)"/>
    <ellipse cx="688" cy="212" rx="50" ry="30" transform="rotate(8 688 212)"/>
    <ellipse cx="562" cy="172" rx="46" ry="30" transform="rotate(-10 562 172)"/>
    <ellipse cx="648" cy="168" rx="44" ry="28" transform="rotate(8 648 168)"/>
  </g>
  <g style="fill: var(--banner-fg, #1b2a4a); opacity: .6">
    <circle cx="545" cy="176" r="3.5"/><circle cx="578" cy="166" r="3.5"/><circle cx="640" cy="172" r="3.5"/>
    <circle cx="505" cy="212" r="3.5"/><circle cx="600" cy="214" r="3.5"/><circle cx="690" cy="214" r="3.5"/>
  </g>
  <rect x="440" y="215" width="320" height="22" rx="11" style="fill: var(--banner-accent, #c8462a); stroke: var(--banner-fg, #1b2a4a); stroke-width: 6"/>
  <g style="fill: none; stroke: var(--banner-fg, #1b2a4a); stroke-width: 6; stroke-linecap: round">
    <path d="M442 224 q-28 0 -28 16 q0 14 28 14"/>
    <path d="M758 224 q28 0 28 16 q0 14 -28 14"/>
