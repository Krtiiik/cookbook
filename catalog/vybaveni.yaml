- slug: dutch-oven
  title: Litinový hrnec
  summary: "Těžký hrnec, který drží teplo. Na dušení na plotně i v troubě; srovnání s kastrolem, pekáčem a tlakovým hrncem."
  category: pots
  related: [braising, browning, caramelising, simmering]
- slug: chefs-knife
  title: Kuchařský nůž
  summary: "Velký nůž na krájení na prkénku: jak ho vybrat, jak s ním krájet nadrobno, na kostičky a na plátky a jak ho nabrousit."
  category: tools
  related: [onion, garlic, carrot, sweating, pumpkin]
- slug: thermometer
  title: Teploměr
  summary: "Kdy se vyplatí a jak s ním změřit maso, ohřáté jídlo, cukr a olej: vpichový, do trouby s kabelem, cukrářský."
  category: tools
  related: [simmering, oil, sugar, breading]
- slug: oven
  title: Trouba a pekáč
  summary: "Horní a spodní ohřev, horkovzduch, pekáč a plech. Proč trouba nepeče, jak ukazuje."
  category: pots
  related: [roasting, thermometer, dutch-oven]
- slug: frying-pan
  title: Pánev
  summary: "Nerezová, litinová, ocelová a nepřilnavá: která na co a jak se o ni starat."
  category: pots
  related: [browning, breading, oil, butter]
- slug: sieve
  title: Sítko, cedník a plátýnko
  summary: "Cedník na brambory a těstoviny, sítko na vývar, pasírovanou omáčku a prosetou mouku, plátýnko na úplně čirý vývar."
  category: tools
  related: [simmering, bay-leaf, flour, potatoes, quark]
- slug: blender
  title: Tyčový mixér
  summary: "Na krémové polévky a omáčky v hrnci. Jak mixovat horké, aby nestříkalo."
  category: tools
  related: [pumpkin, sweating]
