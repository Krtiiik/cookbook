- { slug: beef-shank, title: Hovězí kližka, summary: "Maso z nohy, hodně kolagenu a málo tuku. Dlouhým dušením změkne.", category: meat, animal: meat, season: all-year, substitutes: [beef-chuck, beef-cheeks, oxtail] }
